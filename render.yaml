services:
  - type: web
    name: agente-financeiro-autonomo
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npx next start -p $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        value: "file:./dev.db"
      - key: NEXT_PUBLIC_APP_URL
        value: "https://agente-financeiro-autonomo.onrender.com"
      - key: OPENAI_API_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
